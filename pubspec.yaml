name: ecommerce_app
description: A Flutter E-Commerce application with Firebase auth, product listing, cart management and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  connectivity_plus: ^6.1.4
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
